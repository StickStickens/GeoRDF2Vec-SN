[project]
name = "geordf2vec-sn"
version = "0.1.0"
description = "Course project extending GeoRDF2Vec: dataset preparation and exploratory analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "igraph>=1.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pyarrow>=26.0.1",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
